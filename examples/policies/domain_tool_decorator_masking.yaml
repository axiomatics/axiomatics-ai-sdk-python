identity: 55555555-6666-7777-8888-999999999999
metadata:
  description: >
    Domain for the tool_decorator masking example
    (examples/tool_decorator/masking_server.py).

    The tool always executes. ADS is consulted after execution to decide
    whether the result is returned in full or with post-processing applied:

      Permit -> full result (no masking)
      Deny   -> post-processor applied (PII masked / emails redacted)

    Tools: get_patient_records, get_clinical_notes.

    Subject attribute:  username
    Resource attribute: tool_name (from DefaultServerContextProvider.get_resource)

    Policy:
      alice -- Permit on both tools -> always receives full, unmasked data
      bob   -- Deny on both tools   -> always receives masked / redacted data

    Note: masking is application-level logic defined in the post_processor.
    ADS only drives the permit/deny decision.

attributes:
  username:
    xacmlId: username
    category: AccessSubject
    datatype: string
  name:
    xacmlId: name
    category: Action
    datatype: string
  tool_name:
    xacmlId: tool_name
    category: Resource
    datatype: string

policy:
  mainPolicyId: 'http://example.com/axiomatics/examples/ToolDecoratorMasking'
  xacmlSpecifications:
    - >-
      <xacml3:PolicySet Version="1.0"
      xmlns:xacml3="urn:oasis:names:tc:xacml:3.0:core:schema:wd-17"
      PolicyCombiningAlgId="urn:oasis:names:tc:xacml:1.0:policy-combining-algorithm:first-applicable"
      PolicySetId="http://example.com/axiomatics/examples/ToolDecoratorMasking">
          <xacml3:Description>
            Post-execution data access policy for the tool_decorator masking example.
            Permit = full data; Deny = post-processor (masking) applied.
          </xacml3:Description>
          <xacml3:Target/>

          <xacml3:Policy Version="1.0"
          RuleCombiningAlgId="urn:oasis:names:tc:xacml:1.0:rule-combining-algorithm:first-applicable"
          PolicyId="http://example.com/axiomatics/examples/ToolDecoratorMaskingDataAccess">
              <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                  <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                      <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">post_invocation</xacml3:AttributeValue>
                      <xacml3:AttributeDesignator MustBePresent="false"
                          Category="urn:oasis:names:tc:xacml:3.0:attribute-category:action"
                          AttributeId="name" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                  </xacml3:Match>
              </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>

              <!-- alice: Permit -> full data, no masking applied -->
              <xacml3:Rule RuleId="alice-full-data-access" Effect="Permit">
                  <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">alice</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                              AttributeId="username" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                  </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

              <!-- bob: explicit Deny -> post-processor applied (masking / redaction) -->
              <xacml3:Rule RuleId="bob-masked-data-access" Effect="Deny">
                  <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">bob</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                              AttributeId="username" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                  </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

          </xacml3:Policy>

      </xacml3:PolicySet>
