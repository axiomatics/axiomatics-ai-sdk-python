identity: aaaabbbb-cccc-dddd-eeee-ffffffffffff
metadata:
  description: >
    Domain for the MCP tool visibility examples (examples/langchain_mcp/).

    Only covers the tool_visibility action. The examples call authorized_mcp_tools(), which
    asks the PDP with action=tool_visibility before the tool list reaches the graph.

    Tools exposed by the MCP server: search_docs, get_account_balance, send_email.

    Subject attribute:  username  (first key = primary identifier)
    Resource attribute: tool_name (resource identifier in MultiRequest)

    Policy:
      alice — can see all three tools
      bob   — can only see search_docs

attributes:
  username:
    xacmlId: username
    category: AccessSubject
    datatype: string
  name:
    xacmlId: name
    category: Action
    datatype: string
  tool_name:
    xacmlId: tool_name
    category: Resource
    datatype: string

policy:
  mainPolicyId: 'http://example.com/axiomatics/examples/McpToolFiltering'
  xacmlSpecifications:
    - >-
      <xacml3:PolicySet Version="1.0"
      xmlns:xacml3="urn:oasis:names:tc:xacml:3.0:core:schema:wd-17"
      PolicyCombiningAlgId="urn:oasis:names:tc:xacml:1.0:policy-combining-algorithm:first-applicable"
      PolicySetId="http://example.com/axiomatics/examples/McpToolFiltering">
          <xacml3:Description>Tool listing policy for the MCP tool visibility example.</xacml3:Description>
          <xacml3:Target/>

          <xacml3:Policy Version="1.0"
          RuleCombiningAlgId="urn:oasis:names:tc:xacml:1.0:rule-combining-algorithm:first-applicable"
          PolicyId="http://example.com/axiomatics/examples/McpToolListing">
              <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                  <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                      <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">tool_visibility</xacml3:AttributeValue>
                      <xacml3:AttributeDesignator MustBePresent="false"
                          Category="urn:oasis:names:tc:xacml:3.0:attribute-category:action"
                          AttributeId="name" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                  </xacml3:Match>
              </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>

              <!-- Alice can see all tools -->
              <xacml3:Rule RuleId="alice-can-list-all-tools" Effect="Permit">
                  <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">alice</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                              AttributeId="username" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                  </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

              <!-- Bob can only see search_docs -->
              <xacml3:Rule RuleId="bob-can-list-search-docs" Effect="Permit">
                  <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">bob</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                              AttributeId="username" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">search_docs</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                              AttributeId="tool_name" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                  </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

          </xacml3:Policy>

      </xacml3:PolicySet>
