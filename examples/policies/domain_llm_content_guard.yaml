identity: 33333333-4444-5555-6666-777777777777
metadata:
  description: >
    Domain for the LLM content-guard example (examples/langchain_agents/llm_content_guard.py).

    Two decision-based enforcement points, each fed by an LLM attribute enricher (a PIP) that
    classifies content into attributes; ADS makes the decision combining the content
    classification with WHO is asking. The enricher only classifies — the policy decides:

      before_model — guards the user prompt. The input guard labels the question's `topic`;
                     this policy denies the restricted business topics (acquisitions, layoffs)
                     for regular employees, but exempts alice (an executive).
      after_model  — guards the final answer. The output guard flags *specific* PII types;
                     this policy denies answers that contain an SSN or a credit-card number,
                     but exempts alice (HR, authorized to see SSNs). A general name/title/email
                     is allowed for everyone.

    So the same question resolves differently by subject: alice (privileged) is allowed;
    bob (regular employee) is blocked.

    Subject attribute:  username  (alice = executive/HR exemption; anyone else = restricted)
    Action attribute:   name      (before_model | after_model)
    Resource attributes (produced by the enrichers):
      topic                — string, the input guard's topic label
      contains_ssn         — boolean, the output guard flags a US Social Security Number
      contains_credit_card — boolean, the output guard flags a credit-card number

    The enrichers also send a "<name>_available" boolean sentinel; XACML ignores undeclared
    attributes, so it is not declared here (the SDK's fail_closed shortcut handles the
    couldn't-classify case before ADS is even called).

attributes:
  username:
    xacmlId: username
    category: AccessSubject
    datatype: string
  name:
    xacmlId: name
    category: Action
    datatype: string
  topic:
    xacmlId: topic
    category: Resource
    datatype: string
  contains_ssn:
    xacmlId: contains_ssn
    category: Resource
    datatype: boolean
  contains_credit_card:
    xacmlId: contains_credit_card
    category: Resource
    datatype: boolean

policy:
  mainPolicyId: 'http://example.com/axiomatics/examples/LlmContentGuard'
  xacmlSpecifications:
    - >-
      <xacml3:PolicySet Version="1.0"
      xmlns:xacml3="urn:oasis:names:tc:xacml:3.0:core:schema:wd-17"
      PolicyCombiningAlgId="urn:oasis:names:tc:xacml:1.0:policy-combining-algorithm:first-applicable"
      PolicySetId="http://example.com/axiomatics/examples/LlmContentGuard">
          <xacml3:Description>LLM prompt/answer content guards.</xacml3:Description>
          <xacml3:Target/>

          <!-- Policy 1: input guard (user prompt) — deny restricted business topics -->
          <xacml3:Policy Version="1.0"
          RuleCombiningAlgId="urn:oasis:names:tc:xacml:1.0:rule-combining-algorithm:first-applicable"
          PolicyId="http://example.com/axiomatics/examples/InputGuard">
              <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                  <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                      <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">before_model</xacml3:AttributeValue>
                      <xacml3:AttributeDesignator MustBePresent="false"
                          Category="urn:oasis:names:tc:xacml:3.0:attribute-category:action"
                          AttributeId="name" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                  </xacml3:Match>
              </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>

              <!-- Executives (alice) may ask about any topic — evaluated first. -->
              <xacml3:Rule RuleId="permit-executive" Effect="Permit">
                  <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">alice</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                              AttributeId="username" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                  </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

              <!-- Otherwise deny when the topic is a restricted one (acquisitions OR layoffs).
                   AnyOf = OR over the two AllOf topic matches. -->
              <xacml3:Rule RuleId="deny-restricted-topic" Effect="Deny">
                  <xacml3:Target><xacml3:AnyOf>
                      <xacml3:AllOf>
                          <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                              <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">acquisitions</xacml3:AttributeValue>
                              <xacml3:AttributeDesignator MustBePresent="false"
                                  Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                  AttributeId="topic" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                          </xacml3:Match>
                      </xacml3:AllOf>
                      <xacml3:AllOf>
                          <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                              <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">layoffs</xacml3:AttributeValue>
                              <xacml3:AttributeDesignator MustBePresent="false"
                                  Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                  AttributeId="topic" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                          </xacml3:Match>
                      </xacml3:AllOf>
                  </xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

              <!-- Otherwise allow the prompt -->
              <xacml3:Rule RuleId="permit-allowed-topic" Effect="Permit"/>
          </xacml3:Policy>

          <!-- Policy 2: output guard (final answer) — deny specific PII (SSN / credit card) -->
          <xacml3:Policy Version="1.0"
          RuleCombiningAlgId="urn:oasis:names:tc:xacml:1.0:rule-combining-algorithm:first-applicable"
          PolicyId="http://example.com/axiomatics/examples/OutputGuard">
              <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                  <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                      <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">after_model</xacml3:AttributeValue>
                      <xacml3:AttributeDesignator MustBePresent="false"
                          Category="urn:oasis:names:tc:xacml:3.0:attribute-category:action"
                          AttributeId="name" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                  </xacml3:Match>
              </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>

              <!-- HR (alice) may receive answers containing SSNs — evaluated first. -->
              <xacml3:Rule RuleId="permit-hr" Effect="Permit">
                  <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                      <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                          <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">alice</xacml3:AttributeValue>
                          <xacml3:AttributeDesignator MustBePresent="false"
                              Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                              AttributeId="username" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                      </xacml3:Match>
                  </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

              <!-- Otherwise deny when the answer contains an SSN OR a credit-card number -->
              <xacml3:Rule RuleId="deny-specific-pii" Effect="Deny">
                  <xacml3:Target><xacml3:AnyOf>
                      <xacml3:AllOf>
                          <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:boolean-equal">
                              <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#boolean">true</xacml3:AttributeValue>
                              <xacml3:AttributeDesignator MustBePresent="false"
                                  Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                  AttributeId="contains_ssn" DataType="http://www.w3.org/2001/XMLSchema#boolean"/>
                          </xacml3:Match>
                      </xacml3:AllOf>
                      <xacml3:AllOf>
                          <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:boolean-equal">
                              <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#boolean">true</xacml3:AttributeValue>
                              <xacml3:AttributeDesignator MustBePresent="false"
                                  Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                  AttributeId="contains_credit_card" DataType="http://www.w3.org/2001/XMLSchema#boolean"/>
                          </xacml3:Match>
                      </xacml3:AllOf>
                  </xacml3:AnyOf></xacml3:Target>
              </xacml3:Rule>

              <!-- Otherwise allow the answer -->
              <xacml3:Rule RuleId="permit-clean-answer" Effect="Permit"/>
          </xacml3:Policy>

      </xacml3:PolicySet>
