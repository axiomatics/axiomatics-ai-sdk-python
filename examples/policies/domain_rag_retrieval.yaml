identity: 33333333-4444-5555-6666-777777777777
metadata:
  description: >
    Domain for the RAG retrieval-filtering example (examples/rag/agentic_rag.py) and its
    CAQ integration test.

    On a retrieval (action name == "retrieval"), the SDK reverse-queries ADS for the
    condition on the document metadata under which the subject may read. The engine
    returns a Boolean Expression Tree over the unbound resource attributes, which the SDK
    renders into the vector store's metadata filter.

    Subject attributes:  username, department, level
    Action attribute:    name (== "retrieval")
    Resource attributes: resource.department, resource.level  (document metadata; unbound
                         in the reverse query — the SDK strips the "resource." prefix so
                         they line up with the "department"/"level" metadata keys)

    Policy: permit iff
      (resource.department == subject.department OR resource.department == "public")
      AND resource.level <= subject.level

attributes:
  username:
    xacmlId: username
    category: AccessSubject
    datatype: string
  department:
    xacmlId: department
    category: AccessSubject
    datatype: string
  level:
    xacmlId: level
    category: AccessSubject
    datatype: integer
  name:
    xacmlId: name
    category: Action
    datatype: string
  resource.department:
    xacmlId: resource.department
    category: Resource
    datatype: string
  resource.level:
    xacmlId: resource.level
    category: Resource
    datatype: integer

policy:
  mainPolicyId: 'http://example.com/axiomatics/examples/RagRetrieval'
  xacmlSpecifications:
    - >-
      <xacml3:PolicySet Version="1.0"
      xmlns:xacml3="urn:oasis:names:tc:xacml:3.0:core:schema:wd-17"
      PolicyCombiningAlgId="urn:oasis:names:tc:xacml:1.0:policy-combining-algorithm:first-applicable"
      PolicySetId="http://example.com/axiomatics/examples/RagRetrieval">
          <xacml3:Description>Document retrieval filtering via CAQ reverse query.</xacml3:Description>
          <xacml3:Target/>

          <xacml3:Policy Version="1.0"
          RuleCombiningAlgId="urn:oasis:names:tc:xacml:1.0:rule-combining-algorithm:first-applicable"
          PolicyId="http://example.com/axiomatics/examples/DocumentRead">
              <xacml3:Target><xacml3:AnyOf><xacml3:AllOf>
                  <xacml3:Match MatchId="urn:oasis:names:tc:xacml:1.0:function:string-equal">
                      <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">retrieval</xacml3:AttributeValue>
                      <xacml3:AttributeDesignator MustBePresent="false"
                          Category="urn:oasis:names:tc:xacml:3.0:attribute-category:action"
                          AttributeId="name" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                  </xacml3:Match>
              </xacml3:AllOf></xacml3:AnyOf></xacml3:Target>

              <xacml3:Rule RuleId="permit-need-to-know-and-clearance" Effect="Permit">
                  <xacml3:Condition>
                      <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:and">

                          <!-- resource.department == subject.department OR resource.department == "public" -->
                          <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:or">
                              <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:any-of-any">
                                  <xacml3:Function FunctionId="urn:oasis:names:tc:xacml:1.0:function:string-equal"/>
                                  <xacml3:AttributeDesignator MustBePresent="false"
                                      Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                      AttributeId="resource.department" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                                  <xacml3:AttributeDesignator MustBePresent="false"
                                      Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                                      AttributeId="department" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                              </xacml3:Apply>
                              <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:any-of">
                                  <xacml3:Function FunctionId="urn:oasis:names:tc:xacml:1.0:function:string-equal"/>
                                  <xacml3:AttributeValue DataType="http://www.w3.org/2001/XMLSchema#string">public</xacml3:AttributeValue>
                                  <xacml3:AttributeDesignator MustBePresent="false"
                                      Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                      AttributeId="resource.department" DataType="http://www.w3.org/2001/XMLSchema#string"/>
                              </xacml3:Apply>
                          </xacml3:Apply>

                          <!-- resource.level <= subject.level -->
                          <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:integer-less-than-or-equal">
                              <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:integer-one-and-only">
                                  <xacml3:AttributeDesignator MustBePresent="false"
                                      Category="urn:oasis:names:tc:xacml:3.0:attribute-category:resource"
                                      AttributeId="resource.level" DataType="http://www.w3.org/2001/XMLSchema#integer"/>
                              </xacml3:Apply>
                              <xacml3:Apply FunctionId="urn:oasis:names:tc:xacml:1.0:function:integer-one-and-only">
                                  <xacml3:AttributeDesignator MustBePresent="false"
                                      Category="urn:oasis:names:tc:xacml:1.0:subject-category:access-subject"
                                      AttributeId="level" DataType="http://www.w3.org/2001/XMLSchema#integer"/>
                              </xacml3:Apply>
                          </xacml3:Apply>

                      </xacml3:Apply>
                  </xacml3:Condition>
              </xacml3:Rule>
          </xacml3:Policy>

      </xacml3:PolicySet>
